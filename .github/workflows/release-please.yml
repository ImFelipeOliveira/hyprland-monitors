name: Release Please

# Watches conventional commits on main and maintains a release PR.
# Merging that PR bumps the version, updates CHANGELOG.md, tags, and
# publishes a GitHub release — which triggers release.yml to attach binaries.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # Releases published with GITHUB_TOKEN don't fire the `release` event, so the
  # binary build and AUR publish are invoked directly from here.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
