name: Release binaries

# Builds and attaches a prebuilt binary tarball (+ sha256) to a GitHub release.
# Releases created by release-please (GITHUB_TOKEN) do NOT fire the `release`
# event, so release-please.yml calls this as a reusable workflow; the `release`
# and `workflow_dispatch` triggers cover manual releases and re-runs.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-upload:
    name: Build x86_64-linux binary
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          PKG="hyprland-monitors-${TAG}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${PKG}"
          cp target/release/hyprland-monitors "dist/${PKG}/"
          cp assets/hyprland-monitors.desktop LICENSE README.md "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          (cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256")

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
